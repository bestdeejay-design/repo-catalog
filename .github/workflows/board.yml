name: Catalog board
on:
  push:
    branches: [main]
    paths:
      - 'TASKS.md'
      - 'OPTIONS.md'
      - 'STARS.md'
      - 'STARS-ARCHIVE.md'
      - 'generate_board.py'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Собрать BOARD.md
        run: python3 generate_board.py
      - name: Закоммитить, если изменилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BOARD.md
          if git diff --staged --quiet; then
            echo "Без изменений"
          else
            git commit -m "chore(board): пересборка $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
